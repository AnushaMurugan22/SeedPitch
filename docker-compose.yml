
services:
  api:
    build: .
    container_name: seedpitch_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://seedpitch:seedpitch123@db:5432/seedpitch_db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    container_name: seedpitch_db
    environment:
      POSTGRES_USER: seedpitch
      POSTGRES_PASSWORD: seedpitch123
      POSTGRES_DB: seedpitch_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seedpitch -d seedpitch_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
